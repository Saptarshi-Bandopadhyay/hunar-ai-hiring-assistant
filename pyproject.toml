[project]
name = "hunar-ai-hiring-assistant"
version = "0.1.0"
description = "Hunar AI Hiring Assistant - FDE assignment"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52.4",
]

[tool.alembic]
script_location = "alembic"
